<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochi — SERA Presence</title>
  <link rel="stylesheet" href="./src/ui/presence.css">
</head>
<body>
  <!-- Fixed Translucent Glass Box Container -->
  <div id="glass-panel" class="glass-panel state-idle" data-state="IDLE" data-tone="cyan" data-audio="idle" data-connection="CONNECTING">
    <!-- Header Bar (Only Draggable Region) -->
    <div class="top-bar">
      <div class="sera-brand">
        <span class="status-dot"></span>
        <span>MOCHI <em>× SERA</em></span>
        <span class="presence-id">PRESENCE</span>
        <span id="connection-status" class="connection-status" data-connection="CONNECTING">CONNECTING</span>
      </div>
      <div class="window-actions">
        <button id="command-center-btn" class="action-btn" title="Open Technical Command Center">CMD</button>
        <button id="details-toggle" class="action-btn" title="Toggle presence details" aria-expanded="false">INFO</button>
        <button id="minimize-btn" class="action-btn" title="Minimize to Tray">−</button>
        <button id="close-btn" class="action-btn close-action" title="Close Presence">×</button>
      </div>
    </div>

    <!-- 1. Protected Visual Viewport: Dedicated exclusively to 3D Consciousness Core -->
    <div id="core-viewport" class="core-viewport">
      <div class="core-field" aria-hidden="true">
        <span class="field-line field-line-a"></span>
        <span class="field-line field-line-b"></span>
        <span class="field-node node-a"></span>
        <span class="field-node node-b"></span>
        <span class="field-node node-c"></span>
      </div>
      <div class="state-orbit" aria-hidden="true"><span></span><span></span><span></span></div>
      <canvas id="presence-canvas"></canvas>
      <div class="core-readout" aria-hidden="true">
        <span class="readout-kicker">MOCHI STATE</span>
        <span class="readout-index" data-state-index>01</span>
      </div>
      <div class="state-rail" aria-hidden="true">
        <span class="rail-mark active"></span><span class="rail-mark"></span><span class="rail-mark"></span><span class="rail-mark"></span>
      </div>
    </div>

    <!-- 2. Separate Bottom Conversation Drawer: Lives strictly below the core viewport -->
    <div id="bottom-drawer" class="bottom-drawer">
      <!-- Real-Time Voice Conversation Container (Animated Expansion) -->
      <div id="conversation-container" class="conversation-container">
        <!-- User Command Box (Always Remains Visible) -->
        <div id="user-caption-box" class="caption-card user-card">
          <div class="caption-header">
            <div class="badge-wrapper">
              <span class="speaker-badge user-badge">
                <svg class="mic-wave-icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                </svg>
                YOU
              </span>
              <span id="user-status-pill" class="status-pill listening-pill">LISTENING</span>
            </div>
            <span id="user-caption-time" class="caption-timestamp">LIVE</span>
          </div>
          <div id="user-caption-text" class="caption-text user-text">
            <span class="caption-placeholder">Hold Ctrl+Alt+Space to speak...</span>
          </div>
        </div>

        <!-- SERA Response Box (Expands Below Command, Keeping Command Visible) -->
        <div id="sera-caption-box" class="caption-card sera-card hidden">
          <div class="caption-header">
            <div class="badge-wrapper">
              <span class="speaker-badge sera-badge">
                <span class="sera-core-dot"></span>
                MOCHI
              </span>
              <span id="sera-status-pill" class="status-pill responding-pill">PROCESSING</span>
            </div>
            <span id="sera-caption-time" class="caption-timestamp">SERA</span>
          </div>
          <div id="sera-caption-text" class="caption-text sera-text"></div>
        </div>
      </div>

      <!-- Bottom Kinetic Status Bar -->
      <div class="bottom-bar">
        <section id="approval-context" class="approval-context" aria-live="polite" aria-label="Approval needed" hidden>
          <span class="approval-kicker">REVIEW NEEDED IN SERA</span>
          <span id="approval-action" class="approval-action"></span>
          <span id="approval-reason" class="approval-reason"></span>
        </section>
        <div class="state-summary"><span class="summary-rule"></span><span id="kinetic-status" class="kinetic-status" data-state-label>HERE WITH YOU</span><span class="summary-rule"></span></div>
        <div id="kinetic-substatus" class="kinetic-substatus" data-state-cue>Ready when you are</div>
        <div class="task-context" data-task-context>READY WHEN YOU ARE</div>
        <progress id="task-progress" class="task-progress" data-task-progress max="1" aria-label="Task progress" hidden></progress>
        <span id="tts-status" class="visually-hidden" role="status" aria-live="polite">Voice playback idle</span>
      </div>
    </div>
  </div>

  <!-- Entry Script -->
  <script type="module" src="./src/App.js"></script>
</body>
</html>
